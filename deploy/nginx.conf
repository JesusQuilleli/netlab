# Configuracion de nginx para netlab.
#
# Sustituye DOMINIO.TLD por tu dominio antes de usarla.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/netlab
#   sudo nano /etc/nginx/sites-available/netlab     # pon tu dominio
#   sudo ln -s /etc/nginx/sites-available/netlab /etc/nginx/sites-enabled/netlab
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Y despues el certificado:
#   sudo certbot --nginx -d DOMINIO.TLD

# Puerto 80 solo para el challenge de Let's Encrypt y para redirigir. El
# trafico normal va al 443.
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO.TLD;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMINIO.TLD;

    # certbot rellena estos dos rutas al ejecutar `certbot --nginx`.
    ssl_certificate     /etc/letsencrypt/live/DOMINIO.TLD/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO.TLD/privkey.pem;

    # Cabeceras de seguridad. netlab ya envia CSP, nosniff y X-Frame-Options en
    # sus respuestas; estas son la capa de fuera, por si algo se sirve sin
    # pasar por el servidor.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "same-origin" always;

    # Sin esto, un informe generado por netlab acabaria en un proxy que guarda
    # una copia en disco junto con la IP de quien lo pidio.
    access_log off;
    # El historial y la auditoria los guarda netlab en data/. Un log de acceso
    # duplicaria esa informacion en texto plano.
    error_log /var/log/nginx/netlab.error.log;

    # ---------- parametros que importan para esta aplicacion ----------
    client_max_body_size 4m;
    # Los diagnosticos encadenan varias pruebas de red seguidas; por defecto
    # 60 s se queda corto y el nginx cortaria la peticion con un 504.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # netlab gestiona sus propias cookies y su propio token CSRF: nginx no debe
    # reescribir cookies ni anadir cabeceras de autenticacion.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Esta es la que necesita netlab para saber la IP real del cliente (limite
    # de intentos y auditoria). Ver TRUST_PROXY en .env.example.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
    }
}